
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ParkVision</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0b1725;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    height: 60px;
    padding: 0 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #101f30;
    border-bottom: 1px solid #29425a;
}

.brand {
    font-size: 20px;
    font-weight: bold;
}

.brand span {
    color: #79b8ed;
}

.live {
    font-size: 11px;
    color: #ff777b;
}

.live i {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #ed4c53;
    margin-right: 7px;
}

main {
    height: calc(100vh - 130px);
    min-height: 470px;
    padding: 16px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.panel {
    min-width: 0;
    display: flex;
    flex-direction: column;
    background: #12243a;
    border: 1px solid #2b455e;
    border-radius: 11px;
    overflow: hidden;
}

.heading {
    padding: 12px 15px;
    border-bottom: 1px solid #2b455e;
    font-weight: bold;
}

.heading small {
    display: block;
    margin-top: 4px;
    color: #90a9c0;
    font-size: 11px;
    font-weight: normal;
}

.videoarea {
    flex: 1;
    min-height: 0;
    background: #050a10;
    display: flex;
    align-items: center;
    justify-content: center;
}

video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: black;
}

/* Карта парковки */

.maparea {
    flex: 1;
    min-height: 0;
    padding: 14px;
    background: #145487;
    display: flex;
}

.parking {
    position: relative;
    width: 100%;
    height: 100%;
    min-height: 320px;
    padding: 13px 12px;

    background: #777d80;
    border: 2px solid #b9c1c4;
    border-radius: 5px;

    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: repeat(7, 1fr);

    column-gap: 15px;
    row-gap: 7px;
    overflow: hidden;
}

/* Центральная линия парковки */

.parking::before {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: 50%;
    width: 15px;
    transform: translateX(-50%);

    background: #777d80;
    border-left: 2px solid #dce2e4;
    border-right: 2px solid #dce2e4;

    z-index: 0;
}

/* Парковочное место */

.space {
    position: relative;
    z-index: 1;

    border: 2px solid #e6e9e8;
    border-radius: 7px;

    display: flex;
    align-items: center;
    justify-content: center;

    box-shadow: 0 2px 4px #0003;
    transition: background-color 0.2s;
}

.space.red {
    background: #d83e48;
}

.space.yellow {
    background: #e7b637;
}

.space.green {
    background: #269d5c;
}

/* Кнопки */

.controls {
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;

    background: #101f30;
    border-top: 1px solid #29425a;
}

button {
    min-width: 150px;
    padding: 13px 25px;
    border: 0;
    border-radius: 8px;

    background: #1677c8;
    color: white;

    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #218be0;
}

button.secondary {
    background: #344b62;
}

button.secondary:hover {
    background: #45627e;
}

/* Адаптация под телефон */

@media (max-width: 800px) {
    main {
        height: auto;
        grid-template-columns: 1fr;
        padding: 10px;
    }

    .panel {
        height: 46vh;
        min-height: 310px;
    }

    .controls {
        position: sticky;
        bottom: 0;
    }
}
</style>
</head>

<body>

<header>
    <div class="brand">
        <span>Park</span>Vision
    </div>

    <div class="live">
        <i></i>ДЕМОНСТРАЦИЯ
    </div>
</header>

<main>

    <!-- ВИДЕО -->

    <section class="panel">

        <div class="heading">
            Видеонаблюдение
            <small>Камера парковки</small>
        </div>

        <div class="videoarea">
            <video
                id="video"
                src="parking_crop.mp4"
                preload="auto"
                playsinline>
            </video>
        </div>

    </section>

    <!-- КАРТА -->

    <section class="panel">

        <div class="heading">
            Карта парковки
            <small>Схема парковочных мест</small>
        </div>

        <div class="maparea">
            <div class="parking" id="parking"></div>
        </div>

    </section>

</main>

<!-- УПРАВЛЕНИЕ -->

<div class="controls">

    <button id="start">
        ▶ Запустить
    </button>

    <button class="secondary" id="reset">
        ↺ Сначала
    </button>

</div>

<script>

// Получаем видео и карту

const video = document.getElementById("video");
const parking = document.getElementById("parking");

// Создаём 14 парковочных мест

const cells = [];

for (let row = 0; row < 7; row++) {

    for (let col = 0; col < 2; col++) {

        const el = document.createElement("div");

        el.className = "space red";

        // Индексы для логики:
        // A1-A7 — первый столбец
        // B1-B7 — второй столбец

        const id = (col === 0 ? "A" : "B") + (row + 1);

        el.dataset.id = id;

        parking.appendChild(el);

        cells.push({
            id: id,
            el: el
        });
    }
}


// Определяем цвет парковочного места
// в зависимости от времени видео

function stateAt(id, time) {

    // A2 всегда свободно

    if (id === "A2") {
        return "green";
    }

    // B6:
    // 0–6.5 секунд — жёлтое
    // После 6.5 секунд — зелёное

    if (id === "B6") {

        return time < 6.5
            ? "yellow"
            : "green";
    }

    // B3:
    // 0–5 секунд — красное
    // 5–16 секунд — жёлтое
    // После 16 секунд — зелёное

    if (id === "B3") {

        if (time < 5) {
            return "red";
        }

        if (time < 16) {
            return "yellow";
        }

        return "green";
    }

    // Все остальные места заняты

    return "red";
}


// Обновляем цвета карты

function updateMap() {

    const time = video.currentTime || 0;

    cells.forEach(({ id, el }) => {

        const state = stateAt(id, time);

        el.className = "space " + state;

    });

}


// Кнопка запуска / паузы

document.getElementById("start").addEventListener("click", async () => {

    if (!video.paused) {

        video.pause();

        return;
    }

    try {

        await video.play();

    } catch (error) {

        alert(
            "Не удалось запустить видео. " +
            "Проверьте наличие parking_crop.mp4 рядом с index.html."
        );

    }

});


// Синхронизация карты с видео

video.addEventListener("timeupdate", updateMap);

video.addEventListener("seeked", updateMap);


// Видео закончилось

video.addEventListener("ended", () => {

    document.getElementById("start").textContent = "▶ Запустить";

    updateMap();

});


// Меняем текст кнопки при паузе

video.addEventListener("play", () => {

    document.getElementById("start").textContent = "Ⅱ Пауза";

});

video.addEventListener("pause", () => {

    document.getElementById("start").textContent = "▶ Запустить";

});


// Кнопка «Сначала»

document.getElementById("reset").addEventListener("click", () => {

    video.pause();

    video.currentTime = 0;

    updateMap();

});


// Первоначальное состояние карты

updateMap();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParkVision</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 36px;
            color: #4fc3f7;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }

        .header .subtitle {
            font-size: 14px;
            color: #90a4ae;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .nav {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .nav-item {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(79, 195, 247, 0.3);
            border-radius: 6px;
            color: #b0bec5;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }

        .nav-item:hover,
        .nav-item.active {
            background: rgba(79, 195, 247, 0.15);
            color: #4fc3f7;
            border-color: #4fc3f7;
        }

        /* Главный контейнер — кнопки сверху, карта снизу */
        .parking-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Панель управления — отдельный блок НАД картой */
        .control-panel {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 16px;
            padding: 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(79, 195, 247, 0.2);
            border-radius: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            letter-spacing: 0.5px;
        }

        .btn-start {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            color: #fff;
            box-shadow: 0 4px 12px rgba(46, 204, 113, 0.3);
        }

        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(46, 204, 113, 0.5);
        }

        .btn-start:active {
            transform: translateY(0);
        }

        .btn-reset {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: #fff;
            box-shadow: 0 4px 12px rgba(231, 76, 60, 0.3);
        }

        .btn-reset:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(231, 76, 60, 0.5);
        }

        .btn-reset:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            font-size: 13px;
            color: #90a4ae;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #78909c;
        }

        .status-dot.active {
            background: #2ecc71;
            box-shadow: 0 0 8px #2ecc71;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Контейнер карты */
        .map-container {
            position: relative;
            width: 100%;
            background: #0f1419;
            border: 1px solid rgba(79, 195, 247, 0.2);
            border-radius: 10px;
            overflow: hidden;
        }

        #parkingCanvas {
            display: block;
            width: 100%;
            height: 500px;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #b0bec5;
        }

        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 4px;
        }

        @media (max-width: 600px) {
            .header h1 { font-size: 28px; }
            .btn { padding: 10px 20px; font-size: 14px; }
            #parkingCanvas { height: 350px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>ParkVision</h1>
        <div class="subtitle">Демонстрация</div>
    </div>

    <nav class="nav">
        <div class="nav-item active">Видеонаблюдение</div>
        <div class="nav-item">Камера парковки</div>
        <div class="nav-item">Карта парковки</div>
        <div class="nav-item">Схема парковочных мест</div>
    </nav>

    <div class="parking-container">
        <!-- Панель управления: кнопки В РЯД, не налезают друг на друга -->
        <div class="control-panel">
            <button id="startBtn" class="btn btn-start">▶ Запустить</button>
            <button id="resetBtn" class="btn btn-reset">↺ Сначала</button>
            <div class="status-indicator">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">Ожидание</span>
            </div>
        </div>

        <!-- Карта парковки -->
        <div class="map-container">
            <canvas id="parkingCanvas"></canvas>
        </div>

        <div class="legend">
            <div class="legend-item">
                <div class="legend-color" style="background:#2ecc71"></div>
                <span>Свободно</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background:#e74c3c"></div>
                <span>Занято</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background:#f39c12"></div>
                <span>Движение</span>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('parkingCanvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');

        let animationId = null;
        let cars = [];
        let spots = [];
        let running = false;

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            initSpots();
            draw();
        }

        function initSpots() {
            spots = [];
            const rows = 3;
            const cols = 10;
            const spotW = 50;
            const spotH = 80;
            const startX = (canvas.width - cols * (spotW + 10)) / 2;
            const startY = 60;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    spots.push({
                        x: startX + c * (spotW + 10),
                        y: startY + r * (spotH + 40),
                        w: spotW,
                        h: spotH,
                        occupied: Math.random() > 0.6
                    });
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Дороги
            ctx.strokeStyle = '#2c3e50';
            ctx.lineWidth = 2;
            ctx.setLineDash([10, 10]);
            for (let r = 0; r < 3; r++) {
                const y = 60 + r * 120 + 100;
                ctx.beginPath();
                ctx.moveTo(20, y);
                ctx.lineTo(canvas.width - 20, y);
                ctx.stroke();
            }
            ctx.setLineDash([]);

            // Места
            spots.forEach(spot => {
                ctx.fillStyle = spot.occupied ? 'rgba(231, 76, 60, 0.2)' : 'rgba(46, 204, 113, 0.15)';
                ctx.strokeStyle = spot.occupied ? '#e74c3c' : '#2ecc71';
                ctx.lineWidth = 2;
                ctx.fillRect(spot.x, spot.y, spot.w, spot.h);
                ctx.strokeRect(spot.x, spot.y, spot.w, spot.h);
            });

            // Машины
            cars.forEach(car => {
                ctx.fillStyle = '#f39c12';
                ctx.fillRect(car.x, car.y, 30, 50);
                ctx.fillStyle = '#fff';
                ctx.font = '10px sans-serif';
                ctx.fillText('🚗', car.x + 5, car.y + 30);
            });
        }

        function animate() {
            cars.forEach(car => {
                car.y += 1.5;
                if (car.y > canvas.height) {
                    car.y = -50;
                    car.x = 50 + Math.random() * (canvas.width - 100);
                }
            });
            draw();
            animationId = requestAnimationFrame(animate);
        }

        function start() {
            if (running) return;
            running = true;
            cars = [];
            for (let i = 0; i < 3; i++) {
                cars.push({
                    x: 50 + Math.random() * (canvas.width - 100),
                    y: -50 - i * 100
                });
            }
            statusDot.classList.add('active');
            statusText.textContent = 'Работает';
            startBtn.disabled = true;
            animate();
        }

        function reset() {
            running = false;
            if (animationId) cancelAnimationFrame(animationId);
            cars = [];
            initSpots();
            draw();
            statusDot.classList.remove('active');
            statusText.textContent = 'Ожидание';
            startBtn.disabled = false;
        }

        startBtn.addEventListener('click', start);
        resetBtn.addEventListener('click', reset);
        window.addEventListener('resize', resizeCanvas);

        resizeCanvas();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParkVision</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 36px;
            color: #4fc3f7;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }

        .header .subtitle {
            font-size: 14px;
            color: #90a4ae;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .nav {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .nav-item {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(79, 195, 247, 0.3);
            border-radius: 6px;
            color: #b0bec5;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }

        .nav-item:hover,
        .nav-item.active {
            background: rgba(79, 195, 247, 0.15);
            color: #4fc3f7;
            border-color: #4fc3f7;
        }

        /* === ИЗМЕНЕНО: кнопки теперь в отдельном блоке НАД картой === */
        .control-panel {
            display: flex;
            flex-direction: row;
            justify-content: center;
            gap: 16px;
            margin-bottom: 16px;
        }

        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .btn-start {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            color: #fff;
            box-shadow: 0 4px 12px rgba(46, 204, 113, 0.3);
        }

        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(46, 204, 113, 0.5);
        }

        .btn-reset {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: #fff;
            box-shadow: 0 4px 12px rgba(231, 76, 60, 0.3);
        }

        .btn-reset:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(231, 76, 60, 0.5);
        }

        .map-container {
            position: relative;
            width: 100%;
            background: #0f1419;
            border: 1px solid rgba(79, 195, 247, 0.2);
            border-radius: 10px;
            overflow: hidden;
        }

        #parkingCanvas {
            display: block;
            width: 100%;
            height: 500px;
        }

        @media (max-width: 600px) {
            .header h1 { font-size: 28px; }
            .btn { padding: 10px 20px; font-size: 14px; }
            #parkingCanvas { height: 350px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>ParkVision</h1>
        <div class="subtitle">ДЕМОНСТРАЦИЯ</div>
    </div>

    <nav class="nav">
        <div class="nav-item active">Видеонаблюдение</div>
        <div class="nav-item">Камера парковки</div>
        <div class="nav-item">Карта парковки</div>
        <div class="nav-item">Схема парковочных мест</div>
    </nav>

    <!-- КНОПКИ ВЫНЕСЕНЫ ОТДЕЛЬНО НАД КАРТОЙ -->
    <div class="control-panel">
        <button class="btn btn-start">▶ Запустить</button>
        <button class="btn btn-reset">↺ Сначала</button>
    </div>

    <div class="map-container">
        <canvas id="parkingCanvas"></canvas>
    </div>
</body>
</html>
